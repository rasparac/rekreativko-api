  api.Response-github_com_rasparac_rekreativko-api_account-profile_internal_interfaces_http_dtos_Setting:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/github_com_rasparac_rekreativko-api_account-profile_internal_interfaces_http_dtos.Setting'
        description: only on success
      error:
        allOf:
        - $ref: '#/definitions/api.APIError'
        description: only on error
      message:
        example: Operation completed successfully
        type: string
      status:
        example: success
        type: string
      timestamp:
