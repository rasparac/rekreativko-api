# NATS server for docker-compose and the integration tests (prod: rekreativko-infra).
#
# Every connection logs in as its service's user; passwords come from the
# environment (NATS_<SERVICE>_PASSWORD). Only the outbox-publisher may publish
# domain events or manage the streams, so a compromised service can't forge an
# event (identity.account.erased erases data everywhere) or delete a stream.
#
# Consumer rights can't be limited to a service's own consumers: a durable name
# such as activity-events-identity-account-erased is one subject token, and
# wildcards only match whole tokens. Each consumer service may therefore use any
# consumer of the EVENTS stream, but not delete one.

jetstream {
  store_dir: "/data"
}

http_port: 8222

# What every service that consumes events needs (shared/events.natsBroker).
CONSUMER_PUBLISH: [
  "$JS.API.INFO"
  "$JS.API.STREAM.INFO.EVENTS"
  "$JS.API.STREAM.INFO.DLQ"
  # create or look up its durable consumers, and pull from them
  "$JS.API.CONSUMER.CREATE.EVENTS.>"
  "$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.*"
  "$JS.API.CONSUMER.INFO.EVENTS.*"
  "$JS.API.CONSUMER.MSG.NEXT.EVENTS.*"
  "$JS.ACK.EVENTS.>"
  # dead-lettering: read back a message the consumer gave up on, copy it to the DLQ
  "$JS.API.STREAM.MSG.GET.EVENTS"
  "dlq.>"
]

CONSUMER_SUBSCRIBE: [
  "_INBOX.>"
  "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.EVENTS.*"
]

authorization {
  users: [
    {
      user: outbox_publisher
      password: $NATS_OUTBOX_PUBLISHER_PASSWORD
      permissions: {
        publish: {
          allow: [
            "events.>"
            "$JS.API.INFO"
            "$JS.API.STREAM.CREATE.EVENTS"
            "$JS.API.STREAM.UPDATE.EVENTS"
            "$JS.API.STREAM.INFO.EVENTS"
            "$JS.API.STREAM.CREATE.DLQ"
            "$JS.API.STREAM.UPDATE.DLQ"
            "$JS.API.STREAM.INFO.DLQ"
          ]
        }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
    {
      user: identity
      password: $NATS_IDENTITY_PASSWORD
      permissions: { publish: { allow: $CONSUMER_PUBLISH }, subscribe: { allow: $CONSUMER_SUBSCRIBE } }
    }
    {
      user: account_profile
      password: $NATS_ACCOUNT_PROFILE_PASSWORD
      permissions: { publish: { allow: $CONSUMER_PUBLISH }, subscribe: { allow: $CONSUMER_SUBSCRIBE } }
    }
    {
      user: notifications
      password: $NATS_NOTIFICATIONS_PASSWORD
      permissions: { publish: { allow: $CONSUMER_PUBLISH }, subscribe: { allow: $CONSUMER_SUBSCRIBE } }
    }
    {
      user: activity
      password: $NATS_ACTIVITY_PASSWORD
      permissions: {
        publish: { allow: $CONSUMER_PUBLISH }
        subscribe: {
          allow: [
            "_INBOX.>"
            "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.EVENTS.*"
            # the live hub's broadcast subscription (activity/internal/interfaces/live)
            "events.activity.session.>"
          ]
        }
      }
    }
  ]
}
