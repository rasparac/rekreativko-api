  github_com_rasparac_rekreativko-api_identity_internal_interfaces_http_dtos.ResendVerificationCodeRequest:
    properties:
      identity:
        example: +1234567890,user@gmail.com
        type: string
      type:
        enum:
        - email
        - phone
        example: email
        type: string
    required:
    - identity
    - type
    type: object
  github_com_rasparac_rekreativko-api_identity_internal_interfaces_http_dtos.TokenPairResponse:
    properties:
      access_token:
        example: ey12344fwbfwbefiuwgfiiAA...
        type: string
      expires_in:
        example: 3600
        type: integer
      refresh_token:
        example: ey12344fwbfwbefiuwgfiiAA==
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  github_com_rasparac_rekreativko-api_identity_internal_interfaces_http_dtos.VerifyAccountRequest:
    properties:
      code:
        example: "123456"
        minLength: 6
