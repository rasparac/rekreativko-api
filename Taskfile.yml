# https://taskfile.dev

version: "3"

vars:
  DB_HOST: localhost
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_NAME: rekreativko
  DB_URL: postgres://{{.DB_USER}}:{{.DB_PASSWORD}}@{{.DB_HOST}}/{{.DB_NAME}}?sslmode=disable

dotenv: [".env"]

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ============================================================================
  # Build tasks
  # ============================================================================

  build:
    desc: Build all services
    cmds:
      - echo "Building all services..."
      - go build -o bin/activity-api ./activity/cmd/api/...
      - go build -o bin/activity-cron ./activity/cmd/cron/...
      - go build -o bin/account-profile ./account-profile/cmd/api/...
      - go build -o bin/identity ./identity/cmd/api/...
      - go build -o bin/gateway ./gateway/cmd/api/...
      - go build -o bin/outbox-publisher ./outbox-publisher/cmd/worker/...
      - echo "✓ Build complete! Binaries in ./bin/"

  build:activity:
    desc: Build activity service
    cmds:
      - echo "Building activity service..."
      - go build -o bin/activity-api ./activity/cmd/api/...
      - go build -o bin/activity-cron ./activity/cmd/cron/...

  build:identity:
    desc: Build identity service
    cmds:
      - echo "Building identity service..."
      - go build -o bin/identity ./identity/cmd/api/...

  build:account-profile:
    desc: Build account-profile service
    cmds:
      - echo "Building account-profile service..."
      - go build -o bin/account-profile ./account-profile/cmd/api/...

  build:gateway:
    desc: Build gateway service
    cmds:
      - echo "Building gateway service..."
      - go build -o bin/gateway ./gateway/cmd/api/...

  build:outbox:
    desc: Build outbox-publisher service
    cmds:
      - echo "Building outbox-publisher service..."
      - go build -o bin/outbox-publisher ./outbox-publisher/cmd/worker/...

  # ============================================================================
  # Test tasks
  # ============================================================================

  test:
    desc: Run unit tests only (default)
    cmds:
      - task: test:unit

  test:unit:
    desc: Run unit tests only
    cmds:
      - echo "Running unit tests..."
      - go test ./... -short

  test:integration:
    desc: Run integration tests (requires Docker)
    cmds:
      - echo "Running integration tests..."
      - echo "This requires Docker to be running"
      - go test -tags=integration ./...

  test:all:
    desc: Run all tests (unit + integration)
    cmds:
      - echo "Running all tests..."
      - go test -tags=integration ./...

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - echo "Running tests with coverage..."
      - go test -tags=integration -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "✓ Coverage report generated - coverage.html"

  test:verbose:
    desc: Run tests with verbose output
    cmds:
      - echo "Running tests with verbose output..."
      - go test -tags=integration -v ./...

  # Per-service integration tests
  test:activity:integration:
    desc: Run activity integration tests
    cmds:
      - echo "Running activity integration tests..."
      - go test -tags=integration -v ./activity/internal/infrastructure/persistence/...

  test:identity:integration:
    desc: Run identity integration tests
    cmds:
      - echo "Running identity integration tests..."
      - go test -tags=integration -v ./identity/internal/infrastructure/...

  test:account-profile:integration:
    desc: Run account-profile integration tests
    cmds:
      - echo "Running account-profile integration tests..."
      - go test -tags=integration -v ./account-profile/internal/infrastructure/...

  # ============================================================================
  # Migration tasks
  # ============================================================================

  migrate:activity:up:
    desc: Run activity migrations
    deps: [docker:run:local]
    cmds:
      - echo "Running activity migrations..."
      - migrate -path ./activity/internal/infrastructure/persistence/migrations -database "{{.DB_URL}}&x-migrations-table=activity_schema_migrations" up

  migrate:activity:down:
    desc: Rollback activity migration
    deps: [docker:run:local]
    cmds:
      - echo "Rolling back activity migration..."
      - migrate -path ./activity/internal/infrastructure/persistence/migrations -database "{{.DB_URL}}&x-migrations-table=activity_schema_migrations" down 1

  migrate:identity:up:
    desc: Run identity migrations
    deps: [docker:run:local]
    cmds:
      - echo "Running identity migrations..."
      - migrate -path ./identity/internal/infrastructure/persistence/migrations -database "{{.DB_URL}}&x-migrations-table=identity_schema_migrations" up

  migrate:identity:down:
    desc: Rollback identity migration
    deps: [docker:run:local]
    cmds:
      - echo "Rolling back identity migration..."
      - migrate -path ./identity/internal/infrastructure/persistence/migrations -database "{{.DB_URL}}&x-migrations-table=identity_schema_migrations" down 1

  migrate:account-profile:up:
    desc: Run account-profile migrations
    deps: [docker:run:local]
    cmds:
      - echo "Running account-profile migrations..."
      - migrate -path ./account-profile/internal/infrastructure/persistence/migrations -database "{{.DB_URL}}&x-migrations-table=account_profile_schema_migrations" up

  migrate:account-profile:down:
    desc: Rollback account-profile migration
    deps: [docker:run:local]
    cmds:
      - echo "Rolling back account-profile migration..."
      - migrate -path ./account-profile/internal/infrastructure/persistence/migrations -database "{{.DB_URL}}&x-migrations-table=account_profile_schema_migrations" down 1

  migrate:all:up:
    desc: Run all service migrations
    deps: [docker:run:local]
    cmds:
      - echo "Running all migrations..."
      - task: migrate:activity:up
      - task: migrate:identity:up
      - task: migrate:account-profile:up
      - echo "✓ All migrations applied"

  migrate:create:
    desc: Create migration (usage - task migrate:create -- activity create_users_table)
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task migrate:create -- <service> <migration_name>"
          echo "Services: activity, identity, account-profile"
          exit 1
        fi
        SERVICE=$(echo "{{.CLI_ARGS}}" | awk '{print $1}')
        NAME=$(echo "{{.CLI_ARGS}}" | cut -d' ' -f2-)
        if [ -z "$SERVICE" ] || [ -z "$NAME" ]; then
          echo "Error: Both service and migration name required"
          echo "Usage: task migrate:create -- <service> <migration_name>"
          exit 1
        fi
        case $SERVICE in
          activity|identity|account-profile)
            migrate create -ext sql -dir ./$SERVICE/internal/infrastructure/persistence/migrations -seq "$NAME"
            echo "✓ Migration created for $SERVICE: $NAME"
            ;;
          *)
            echo "Error: Unknown service '$SERVICE'"
            echo "Available services: activity, identity, account-profile"
            exit 1
            ;;
        esac

  # ============================================================================
  # Docker tasks
  # ============================================================================

  docker:up:
    desc: Start docker containers
    cmds:
      - echo "Starting local services..."
      - docker compose up -d

  docker:down:
    desc: Stop docker containers
    cmds:
      - echo "Stopping local services..."
      - docker compose down --remove-orphans

  docker:restart:
    desc: Restart docker containers
    cmds:
      - task: docker:down
      - task: docker:up

  docker:run:local:
    desc: Run infrastructure services only (for local development)
    cmds:
      - echo "Starting infrastructure services..."
      - docker compose up -d jaeger prometheus grafana db redis nats swagger-ui

  docs:ui:
    desc: Regenerate swagger docs for all services and (re)start the swagger-ui container
    cmds:
      - task: docs:swagger:all
      - docker compose up -d --force-recreate swagger-ui
      - echo "✓ Swagger UI available at http://localhost:8090"

  docker:build:
    desc: Build all Docker images
    cmds:
      - echo "Building Docker images for all services..."
      - docker compose -f docker-compose.build.yml build
      - echo "✓ All Docker images built"

  docker:build:activity:
    desc: Build activity Docker images
    cmds:
      - echo "Building activity Docker images..."
      - docker compose -f docker-compose.build.yml build activity activity-cron

  docker:build:identity:
    desc: Build identity Docker image
    cmds:
      - echo "Building identity Docker image..."
      - docker compose -f docker-compose.build.yml build identity

  docker:build:account-profile:
    desc: Build account-profile Docker image
    cmds:
      - echo "Building account-profile Docker image..."
      - docker compose -f docker-compose.build.yml build account-profile

  docker:build:gateway:
    desc: Build gateway Docker image
    cmds:
      - echo "Building gateway Docker image..."
      - docker compose -f docker-compose.build.yml build gateway

  docker:build:outbox:
    desc: Build outbox-publisher Docker image
    cmds:
      - echo "Building outbox-publisher Docker image..."
      - docker compose -f docker-compose.build.yml build outbox-publisher

  # ============================================================================
  # Code quality tasks
  # ============================================================================

  lint:
    desc: Run linter
    cmds:
      - echo "Running linter..."
      - golangci-lint run ./...

  fmt:
    desc: Format code
    cmds:
      - echo "Formatting code..."
      - go fmt ./...

  tidy:
    desc: Tidy dependencies
    cmds:
      - echo "Tidying dependencies..."
      - go mod tidy

  clean:
    desc: Clean test cache and containers
    cmds:
      - echo "Cleaning test cache..."
      - go clean -testcache
      - echo "Stopping testcontainers..."
      - docker ps | grep testcontainers | awk '{print $1}' | xargs -r docker kill || true
      - echo "✓ Clean complete"

  check:
    desc: Run all checks (fmt, lint, test-all)
    cmds:
      - task: fmt
      - task: lint
      - task: test:all
      - echo "✓ All checks passed!"

  # ============================================================================
  # Development - run services locally
  # ============================================================================

  run:gateway:
    desc: Run gateway service locally
    cmds:
      - echo "Starting gateway service..."
      - go run ./gateway/cmd/api/main.go

  run:activity:
    desc: Run activity API service locally
    cmds:
      - echo "Starting activity service..."
      - go run ./activity/cmd/api/main.go

  run:activity:cron:
    desc: Run activity cron service locally
    cmds:
      - echo "Starting activity cron service..."
      - go run ./activity/cmd/cron/main.go

  run:identity:
    desc: Run identity service locally
    cmds:
      - echo "Starting identity service..."
      - go run ./identity/cmd/api/main.go

  run:account-profile:
    desc: Run account-profile service locally
    cmds:
      - echo "Starting account-profile service..."
      - go run ./account-profile/cmd/api/main.go

  run:outbox:
    desc: Run outbox-publisher service locally
    cmds:
      - echo "Starting outbox-publisher service..."
      - go run ./outbox-publisher/cmd/worker/main.go

  # ============================================================================
  # Dependencies & tools
  # ============================================================================

  deps:install:
    desc: Download dependencies
    cmds:
      - echo "Downloading dependencies..."
      - go mod download

  deps:update:
    desc: Update dependencies
    cmds:
      - echo "Updating dependencies..."
      - go get -u ./...
      - go mod tidy

  tools:install:
    desc: Install development tools
    cmds:
      - echo "Installing development tools..."
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - go install github.com/swaggo/swag/cmd/swag@latest
      - echo "✓ Tools installed successfully"

  # ============================================================================
  # Swagger documentation
  # ============================================================================

  docs:swagger:all:
    desc: Generate swagger docs for all services
    cmds:
      - echo "Generating swagger docs for all services..."
      - task: docs:swagger:activity
      - task: docs:swagger:identity
      - task: docs:swagger:account-profile
      - echo "✓ All swagger docs generated successfully"

  docs:swagger:activity:
    desc: Generate swagger docs for activity service
    cmds:
      - echo "Generating swagger docs for activity service..."
      - GOFLAGS="-mod=mod" swag init -g cmd/api/main.go -o ./activity/docs --parseDependency --parseInternal -d ./activity
      - echo "✓ Activity swagger docs generated"

  docs:swagger:identity:
    desc: Generate swagger docs for identity service
    cmds:
      - echo "Generating swagger docs for identity service..."
      - GOFLAGS="-mod=mod" swag init -g cmd/api/main.go -o ./identity/docs --parseDependency --parseInternal -d ./identity
      - echo "✓ Identity swagger docs generated"

  docs:swagger:account-profile:
    desc: Generate swagger docs for account-profile service
    cmds:
      - echo "Generating swagger docs for account-profile service..."
      - GOFLAGS="-mod=mod" swag init -g cmd/api/main.go -o ./account-profile/docs --parseDependency --parseInternal -d ./account-profile
      - echo "✓ Account-profile swagger docs generated"

  docs:fmt:
    desc: Format swagger docs
    cmds:
      - swag fmt
