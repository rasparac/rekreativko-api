name: Build & Push Image

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      service:
        description: "Service to build"
        required: true
        type: choice
        options:
          - identity
          - account-profile
          - outbox-publisher
          - gateway
          - activity
          - activity-cron
      version:
        description: "Version tag (e.g. 1.2.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Runs one at a time so an older commit can't finish last and roll infra back to its image
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/rasparac

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity
            cmd_path: api
          - service: account-profile
            cmd_path: api
          - service: gateway
            cmd_path: api
          - service: activity
            cmd_path: api
          - service: activity-cron
            service_name: activity
            cmd_path: cron
          - service: outbox-publisher
            cmd_path: worker
    steps:
      # The matrix can't be filtered at job level, so every later step checks this gate:
      # a manual run builds only the chosen service
      - name: Check if this service should run
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.service }}" != "${{ matrix.service }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'

      - name: Set version
        if: steps.gate.outputs.run == 'true'
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${INPUT_VERSION}" >> $GITHUB_ENV
          else
            echo "VERSION=$(date +'%Y.%m.%d')-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
          fi

      - name: Log in to GitHub Container Registry
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./build/Dockerfile
          push: true
          build-args: |
            SERVICE=${{ matrix.service_name || matrix.service }}
            CMD_PATH=${{ matrix.cmd_path }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ env.VERSION }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

      # Pinned so a runner image change (or a new yq release) can't break the bump step
      - name: Install yq
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Bump image tag in rekreativko-infra
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          set -euo pipefail

          declare -A DEPLOY_PATH=(
            [identity]="k8s/base/identity/deployment.yaml"
            [account-profile]="k8s/base/account-profile/deployment.yaml"
            [gateway]="k8s/base/gateway/deployment.yaml"
            [outbox-publisher]="k8s/base/outbox-publisher/deployment.yaml"
            [activity]="k8s/base/activity/deployment.yaml"
            [activity-cron]="k8s/base/activity/cronjob.yaml"
          )

          SVC="${{ matrix.service }}"
          FILE="${DEPLOY_PATH[$SVC]}"
          IMAGE="${{ env.IMAGE_PREFIX }}/${SVC}:${{ env.VERSION }}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/rasparac/rekreativko-infra.git" infra-repo
          cd infra-repo
          git config user.name "rekreativko-ci"
          git config user.email "ci@rekreativko.local"

          # activity-cron is a CronJob (image path is nested under jobTemplate); everything else is a Deployment
          if [ "$SVC" = "activity-cron" ]; then
            IMAGE_PATH=".spec.jobTemplate.spec.template.spec.containers[0].image"
          else
            IMAGE_PATH=".spec.template.spec.containers[0].image"
          fi

          PUSHED=false
          for i in 1 2 3 4 5; do
            yq -i "${IMAGE_PATH} = \"${IMAGE}\"" "$FILE"
            git add "$FILE"

            if git diff --cached --quiet; then
              echo "image already up to date, nothing to commit"
              PUSHED=true
              break
            fi

            git commit -m "chore(${SVC}): bump image to ${{ env.VERSION }}"

            if git push origin HEAD:main; then
              PUSHED=true
              break
            fi

            echo "push rejected (attempt $i), rebasing onto latest main and retrying..."
            git fetch origin main
            git reset --hard origin/main
            sleep $((RANDOM % 5 + 1))
          done

          if [ "$PUSHED" != "true" ]; then
            echo "::error::failed to push image bump for ${SVC} after 5 attempts"
            exit 1
          fi
