name: Build & Deploy to Dev

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      service:
        description: "Service to build"
        required: true
        type: choice
        options:
          - identity
          - account-profile
          - outbox-publisher
          - gateway
          - notifications
          - location
          - activity
          - activity-cron
      version:
        description: "Version tag (e.g. 1.2.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Runs one at a time so an older commit can't finish last and roll infra back to its image
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/rasparac

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity
            cmd_path: api
            migrations: true
          - service: account-profile
            cmd_path: api
            migrations: true
          - service: gateway
            cmd_path: api
          - service: activity
            cmd_path: api
            migrations: true
          - service: activity-cron
            service_name: activity
            cmd_path: cron
          - service: outbox-publisher
            cmd_path: worker
          - service: notifications
            cmd_path: api
            migrations: true
          - service: location
            cmd_path: api
            migrations: true
    steps:
      # The matrix can't be filtered at job level, so every later step checks this gate:
      # a manual run builds only the chosen service
      - name: Check if this service should run
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.service }}" != "${{ matrix.service }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Full history so the dev deploy can tell whether migrations changed since the running tag
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0

      - name: Set version
        if: steps.gate.outputs.run == 'true'
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${INPUT_VERSION}" >> $GITHUB_ENV
          else
            echo "VERSION=$(date +'%Y.%m.%d')-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
          fi

      - name: Log in to GitHub Container Registry
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./build/Dockerfile
          push: true
          build-args: |
            SERVICE=${{ matrix.service_name || matrix.service }}
            CMD_PATH=${{ matrix.cmd_path }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ env.VERSION }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

      # Migrations ship as their own image (same tag) and are run by hand: rekreativko-infra's task migrate
      - name: Build and push migrations image
        if: steps.gate.outputs.run == 'true' && matrix.migrations
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}/internal/infrastructure/persistence/migrations
          file: ./build/migrations.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}-migrations:${{ env.VERSION }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}-migrations:latest

      # The matrix jobs only build. Bumping infra from each of them made eight jobs push to
      # infra main at once, so one always lost the race: deploy-dev bumps one service at a time
      - name: Record the built tag
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir built
          echo "${{ env.VERSION }}" > "built/${{ matrix.service }}"

      - name: Upload the built tag
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: built-${{ matrix.service }}
          path: built/${{ matrix.service }}

  # Every merge to main goes to dev; other environments only get an image through release.yaml.
  # Runs even if some matrix builds failed, and deploys the ones that were built (a failed build
  # uploads nothing, so it is never pointed at an image that doesn't exist).
  deploy-dev:
    needs: build-and-push
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Full history so the script can tell whether migrations changed since the running tag
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: built-*
          path: built
          merge-multiple: true

      # Pinned so a runner image change (or a new yq release) can't break the bump step
      - name: Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Deploy to dev
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          SKIP_IF_MISSING: "true"
        run: |
          shopt -s nullglob
          builds=(built/*)
          if [ ${#builds[@]} -eq 0 ]; then
            echo "::warning::no image was built, nothing to deploy"
            exit 0
          fi

          # One after the other, so the pushes to infra main never race each other
          failed=0
          for build in "${builds[@]}"; do
            service=$(basename "$build")
            if ! .github/scripts/bump-infra-image.sh dev "$service" "$(cat "$build")"; then
              failed=1
            fi
          done
          exit $failed
