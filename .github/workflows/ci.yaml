name: CI

# Not triggered by pushes to main: build_and_push.yaml calls it first, so a push runs it once
# and nothing is built or deployed unless it passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Same version as Taskfile.yml's tools task
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run ./...

      - name: Unit tests
        run: go test ./... -short -covermode=atomic -coverprofile=coverage.out

      # Unit tests only: the integration tests below are not part of this number
      - name: Coverage
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "Unit test coverage: ${total}"
          echo "### Unit test coverage: ${total}" >> "$GITHUB_STEP_SUMMARY"

      # Testcontainers start PostgreSQL/NATS through the runner's Docker
      - name: Integration tests
        run: go test -tags integration ./...
