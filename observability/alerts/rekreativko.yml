groups:
  - name: rekreativko.availability
    rules:
      - alert: ServiceDown
        expr: up{job="rekreativko"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is down"
          description: "Prometheus has failed to scrape {{ $labels.service }} for 2 minutes."

  - name: rekreativko.pgbouncer
    rules:
      - alert: PgBouncerDown
        expr: up{job="pgbouncer"} == 0 or pgbouncer_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PgBouncer is down"
          description: "Every service reaches Postgres through PgBouncer; it (or its exporter) has been unreachable for 2 minutes."

      - alert: PgBouncerClientsWaiting
        expr: max by (database) (pgbouncer_pools_client_waiting_connections{database!="pgbouncer"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Clients waiting for a Postgres connection in PgBouncer"
          description: "{{ $value | humanize }} client(s) on {{ $labels.database }} have been queued for a server connection for 5 minutes: DEFAULT_POOL_SIZE is too small for the load, or transactions are held open too long."

  - name: rekreativko.http
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
          /
          sum by (service) (rate(http_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on {{ $labels.service }}"
          description: "{{ $labels.service }} has a 5xx error rate above 5% for the last 5 minutes (current value: {{ $value | humanizePercentage }})."

  - name: rekreativko.outbox
    rules:
      - alert: OutboxPublishFailures
        expr: sum(rate(events_processed_total{service="outbox-publisher", status="failed"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox publisher is failing to publish events"
          description: "The outbox publisher has had a non-zero event failure rate for the last 5 minutes (current value: {{ $value | humanize }}/s)."

  - name: rekreativko.erasure
    rules:
      - alert: AccountErasureIncomplete
        expr: max(identity_account_erasures_incomplete) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Account erasures not confirmed by every bounded context"
          description: "{{ $value | humanize }} erased account(s) are missing a <context>.account.erased confirmation past ACCOUNT_ERASURE_INCOMPLETE_AFTER (GDPR Art. 17 erasure must finish within a month). See identity.account_erasure for which contexts are missing."
