global:
  scrape_interval: "15s" # how often to scrape targets
  evaluation_interval: "15s" # how often to evaulate rules

  external_labels:
    cluster: "rekreativko-dev"
    environment: "development"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  # Gateway is the only service with its /metrics endpoint reachable on a
  # publicly-exposed port (docker-compose maps 8080:8080), so it's the only one
  # that requires a bearer token to scrape - see shared/middleware/metrics_auth.go.
  # The credential here is the same shared GATEWAY_API_KEY used everywhere else
  # in this stack, read from a mounted secret file (see docker-compose.yaml's
  # `secrets:` block) so no real value is ever checked into this file.
  - job_name: "rekreativko-gateway"
    scrape_interval: "10s"
    metrics_path: "/metrics"
    authorization:
      credentials_file: "/run/secrets/gateway_api_key"
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          service: "gateway"

  - job_name: "rekreativko"
    scrape_interval: "10s"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["identity:8081"]
        labels:
          service: "identity"

      - targets: ["account-profile:8082"]
        labels:
          service: "account-profile"

      - targets: ["notifications:8083"]
        labels:
          service: "notifications"

      - targets: ["activity:8084"]
        labels:
          service: "activity"

      - targets: ["outbox-publisher:8085"]
        labels:
          service: "outbox-publisher"

  # - job_name: "postgres"
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]

  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9187"]
