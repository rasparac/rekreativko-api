services:
  db:
    image: postgres:17.2
    container_name: rekreativko_db
    ports:
      - "5432:5432"
    volumes:
      - rekreativko_db:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rekreativko"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rekreativko

  # One-shot: applies every service's migrations before any app service starts,
  # so a fresh clone + `docker compose up` is self-contained (no host Go/migrate
  # CLI required). Idempotent - `migrate up` no-ops if already at the latest
  # version, safe to run on every `docker compose up`.
  migrate:
    image: migrate/migrate:latest
    container_name: migrate
    env_file:
      - .env
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        URL="postgres://$$POSTGRES_USER:$$POSTGRES_PASSWORD@$$POSTGRES_HOST:5432/$$POSTGRES_DB?sslmode=disable"
        migrate -path=/migrations/activity -database "$$URL&x-migrations-table=activity_schema_migrations" up
        migrate -path=/migrations/identity -database "$$URL&x-migrations-table=identity_schema_migrations" up
        migrate -path=/migrations/account-profile -database "$$URL&x-migrations-table=account_profile_schema_migrations" up
        migrate -path=/migrations/notifications -database "$$URL&x-migrations-table=notifications_schema_migrations" up
    volumes:
      - ./activity/internal/infrastructure/persistence/migrations:/migrations/activity:ro
      - ./identity/internal/infrastructure/persistence/migrations:/migrations/identity:ro
      - ./account-profile/internal/infrastructure/persistence/migrations:/migrations/account-profile:ro
      - ./notifications/internal/infrastructure/persistence/migrations:/migrations/notifications:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rekreativko

  gateway:
    image: rekreativko/gateway:latest
    container_name: gateway
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - IDENTITY_SERVICE_URL=http://identity:8081
      - ACCOUNT_PROFILE_SERVICE_URL=http://account-profile:8082
      - ACTIVITY_SERVICE_URL=http://activity:8084
      - NOTIFICATIONS_SERVICE_URL=http://notifications:8083
      - SERVICE_NAME=gateway
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - rekreativko
    restart: unless-stopped

  identity:
    image: rekreativko/identity:latest
    container_name: identity
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - PORT=8081
      - SERVICE_NAME=identity
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    networks:
      - rekreativko
    restart: unless-stopped

  account-profile:
    image: rekreativko/account-profile:latest
    container_name: account-profile
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - PORT=8082
      - SERVICE_NAME=account_profile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    networks:
      - rekreativko
    restart: unless-stopped

  activity:
    image: rekreativko/activity:latest
    container_name: activity
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - PORT=8084
      - SERVICE_NAME=activity
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    networks:
      - rekreativko
    restart: unless-stopped

  notifications:
    image: rekreativko/notifications:latest
    container_name: notifications
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - PORT=8083
      - SERVICE_NAME=notifications
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    networks:
      - rekreativko
    restart: unless-stopped

  activity-cron:
    image: rekreativko/activity-cron:latest
    container_name: activity-cron
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - SERVICE_NAME=activity_cron
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    networks:
      - rekreativko
    # One-shot job (generates sessions from templates, expires stale invites,
    # then exits) - not a long-running server, so no restart policy here.
    # Trigger it on demand with: docker compose run --rm activity-cron

  outbox-publisher:
    image: rekreativko/outbox-publisher:latest
    container_name: outbox-publisher
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - SERVICE_NAME=outbox_publisher
      - PORT=8085
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    networks:
      - rekreativko
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    container_name: rekreativko_nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - rekreativko_nats:/data
    networks:
      - rekreativko
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: rekreativko_redis
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - rekreativko_redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rekreativko

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui
    ports:
      - "8090:8080"
    environment:
      URLS: '[{ url: "/specs/identity.json", name: "Identity" }, { url: "/specs/account-profile.json", name: "Account Profile" }, { url: "/specs/activity.json", name: "Activity" }, { url: "/specs/notifications.json", name: "Notifications" }]'
    volumes:
      - ./identity/docs/swagger.json:/usr/share/nginx/html/specs/identity.json:ro
      - ./account-profile/docs/swagger.json:/usr/share/nginx/html/specs/account-profile.json:ro
      - ./activity/docs/swagger.json:/usr/share/nginx/html/specs/activity.json:ro
      - ./notifications/docs/swagger.json:/usr/share/nginx/html/specs/notifications.json:ro
    networks:
      - rekreativko
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
      - "14268:14268"
    env_file:
      - .env
    networks:
      - rekreativko
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/alerts:/etc/prometheus/alerts
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    secrets:
      - gateway_api_key
    depends_on:
      - alertmanager
    networks:
      - rekreativko
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - rekreativko
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
      - loki
    networks:
      - rekreativko
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    networks:
      - rekreativko
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command:
      - "-config.file=/etc/promtail/config.yaml"
    depends_on:
      - loki
    networks:
      - rekreativko
    restart: unless-stopped

volumes:
  rekreativko_db:
  rekreativko_redis:
  rekreativko_nats:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:

networks:
  rekreativko:
    driver: bridge

secrets:
  gateway_api_key:
    file: ./observability/secrets/gateway_api_key.txt
